# --- Terminal / True Color ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

# --- Indexing ---
set -g base-index 1
set -g pane-base-index 1

# --- Prefix ---
set -g prefix C-b

# --- Behavior ---
set -g detach-on-destroy off
set -g mouse on
set -g history-limit 10000

# --- Reload config ---
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux config"

# --- Splits (preserve cwd) ---
unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# --- Copy mode ---
unbind v
bind v copy-mode

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection

# --- Resize panes (vim-style) ---
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5

# --- Maximize pane ---
bind -r m resize-pane -Z

# --- Kill pane (no confirm) ---
bind x kill-pane

# --- Popups ---
# bind-key C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi"
bind-key C-t display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "zsh"
bind-key C-g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "lazygit"
bind-key C-m display-popup -w 95% -h 95% -E "rmpc"

# --- Config menu ---
bind d display-menu -T "#[align=centre]Config" -x C -y C \
    ".zshrc"    z  "display-popup -w 85% -h 85% -E 'nvim ~/.zshrc'" \
    ".zprofile" p  "display-popup -w 85% -h 85% -E 'nvim ~/.zprofile'" \
    ".tmux.conf" t "display-popup -w 85% -h 85% -E 'nvim ~/.config/tmux/tmux.conf'" \
    ".nvim"     v  "display-popup -d '~/dotfiles/nvim/.config/nvim' -E 'nvim ~/dotfiles/nvim/.config/nvim'" \
    "quit"      q  ""

# --- Session tools ---
bind-key K display-popup -E -w 40% "sesh connect \"$(sesh list -i | gum filter --limit 1)\""

bind-key T run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 90%,80%)\""

bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer.sh"
bind-key n command-prompt "new-session -s '%%'"

# --- Switch between windows ---
bind -n M-h previous-window
bind -n M-l next-window

# --- Plugins ---
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/.tmux/plugins

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "on"

# --- Catppuccin ---
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"

# --- Status bar ---
set -g status-position bottom
set -g status-style "bg=#{@thm_bg}"
set -g status-justify centre

set -g status-left-length 100
set -g status-left "#[bg=#{@thm_bg},fg=#{@thm_green}] #S #[fg=#{@thm_overlay_0}]│ #[fg=#{@thm_blue}]#{b:pane_current_path}"

set -g status-right-length 200
set -g status-right "#[fg=#{@thm_rosewater}]#{online_status}"

# --- Windows ---
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "

# --- TPM ---
run '~/.config/tmux/.tmux/plugins/tpm/tpm'
